<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="light only">
<title>Brand Booster Media · Video portal</title>

<link rel="apple-touch-icon" href="Brand Boosters Logo Icon - COLOR.png">

<style>
/* Brand Booster Media design system (tokens + bbm components). Source: the "Brand Booster Media" design system. */
:root {
  --bg:#f7f2f7; --surface:#ffffff; --surface-sunken:#f1e9f1; --border:#e3d7e3; --border-strong:#9c869e;
  --ink:#241726; --ink-muted:#6b5a6e; --primary:#9f298d; --on-primary:#ffffff; --primary-tint:#f6e8f4; --link:#8a2380; --focus:#92278f;
  --good:#1e7047; --good-tint:#e3f2e9; --warning:#8f5000; --warning-tint:#fbefdc; --critical:#b4233a; --critical-tint:#fbe7ea;
  --brand-pink:#fe4c7a; --brand-plum:#92278f;
  --font-display: Poppins, "Avenir Next", system-ui, sans-serif;
  --font-sans: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --radius-sm:8px; --radius-md:14px; --radius-lg:22px; --radius-pill:999px;
  --shadow-card: 0 1px 2px rgba(36,23,38,0.06), 0 4px 16px rgba(36,23,38,0.06);
  color-scheme: light only;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; font-family:var(--font-sans); font-size:16px; line-height:24px; background:var(--bg); color:var(--ink); }
a { color:var(--link); }
h1, h2, h3 { font-family:var(--font-display); text-wrap:balance; margin:0; }
h1 { font-size:28px; line-height:34px; font-weight:700; letter-spacing:-0.01em; }
h2 { font-size:17px; line-height:24px; font-weight:600; }
p { margin:0; }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

/* Shell */
.topbar { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top, 0px); }
.topbar-in { max-width:640px; margin:0 auto; height:60px; display:flex; align-items:center; gap:4px; padding:0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
.topbar .logo { height:40px; width:auto; margin-left:8px; }
.topbar .title { font-family:var(--font-display); font-weight:600; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .spacer { flex:1; }
.icon-btn { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--ink); border-radius:12px; cursor:pointer; }
main { max-width:640px; margin:0 auto; padding:20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display:flex; flex-direction:column; gap:28px; }
section.group { display:flex; flex-direction:column; gap:12px; }
.meta { font-size:14px; line-height:20px; color:var(--ink-muted); }
.center { text-align:center; }
.stack-8 { display:flex; flex-direction:column; gap:8px; }

/* Button */
.bbm-btn { font-family:var(--font-display); font-size:15px; line-height:20px; font-weight:600; min-height:48px; padding:0 var(--space-5); border-radius:var(--radius-md); border:1.5px solid var(--border-strong); background:var(--surface); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); text-decoration:none; }
.bbm-btn-primary { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.bbm-btn-text { background:transparent; border-color:transparent; color:var(--link); padding:0 4px; min-height:44px; text-decoration:underline; text-underline-offset:3px; }
.bbm-btn-block { width:100%; }
.bbm-btn:disabled { opacity:.5; cursor:not-allowed; }
.bbm-btn-sm { min-height:40px; padding:0 14px; }

/* Pills */
.bbm-pill { display:inline-flex; align-items:center; gap:4px; font-size:13px; line-height:18px; font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); background:var(--surface-sunken); color:var(--ink); white-space:nowrap; align-self:flex-start; }
.bbm-pill-good { background:var(--good-tint); color:var(--good); }
.bbm-pill-warning { background:var(--warning-tint); color:var(--warning); }
.bbm-pill-critical { background:var(--critical-tint); color:var(--critical); }
.bbm-pill-primary { background:var(--primary-tint); color:var(--primary); }

/* Cards and lists */
.bbm-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:var(--space-4); display:flex; flex-direction:column; gap:var(--space-3); }
.bbm-card.sunken { background:var(--surface-sunken); box-shadow:none; }
.card-title { font-family:var(--font-display); font-size:22px; line-height:28px; font-weight:600; }
.plan-top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.eyebrow { font-family:var(--font-display); font-size:13px; line-height:18px; font-weight:600; color:var(--ink-muted); }
.list { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:0 16px; }
.list-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); color:var(--ink); text-decoration:none; width:100%; background:none; border-left:0; border-right:0; border-top:0; font:inherit; text-align:left; cursor:pointer; }
.list-row:last-child { border-bottom:0; }
.list-row .main { display:flex; flex-direction:column; min-width:0; }
.list-row strong { font-weight:700; }
.list-row.static { cursor:default; }
.chev { flex:none; color:var(--ink-muted); }
.bbm-notice { border-radius:var(--radius-sm); padding:var(--space-3) var(--space-4); background:var(--primary-tint); color:var(--ink); font-size:15px; line-height:22px; }
.bbm-notice.warn { background:var(--warning-tint); }
.bbm-notice.bad { background:var(--critical-tint); }
.bbm-notice.good { background:var(--good-tint); }

/* Steps */
.bbm-steps { display:flex; flex-direction:column; gap:8px; }
.bbm-steps-label { display:flex; justify-content:space-between; font-size:14px; line-height:20px; color:var(--ink-muted); }
.bbm-steps-label strong { color:var(--ink); font-family:var(--font-display); font-weight:600; font-size:15px; }
.bbm-steps-bar { display:grid; gap:4px; }
.bbm-steps-bar span { height:6px; border-radius:var(--radius-pill); background:var(--border); }
.bbm-steps-bar span.is-done { background:var(--primary); }

/* Rules */
.rule { display:flex; gap:12px; align-items:flex-start; }
.rule svg { flex:none; margin-top:1px; color:var(--primary); }

/* Shot slots */
.bbm-shot { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-3) var(--space-4); display:grid; grid-template-columns:1fr auto; gap:2px var(--space-3); align-items:center; }
.bbm-shot-name { font-family:var(--font-display); font-weight:600; font-size:15px; line-height:20px; }
.bbm-shot-what { font-size:14px; line-height:20px; color:var(--ink-muted); grid-column:1; overflow-wrap:anywhere; }
.bbm-shot-action { grid-row:1 / span 2; grid-column:2; }
.bbm-shot-bar { grid-column:1 / -1; height:4px; border-radius:var(--radius-pill); background:var(--surface-sunken); overflow:hidden; margin-top:var(--space-2); }
.bbm-shot-bar span { display:block; height:100%; width:0; background:var(--primary); transition:width .3s ease; }
.bbm-shot.is-done { background:var(--surface-sunken); }
.bbm-shot.is-failed { border-color:var(--critical); }
.bbm-shot.is-failed .bbm-shot-what { color:var(--critical); }
.bbm-shot.is-problem { border-color:var(--warning); }
.file-btn { position:relative; overflow:hidden; }
.file-btn input { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }
.check-shot { background:var(--surface); border:1px solid var(--border); }

/* Fields */
.form { display:flex; flex-direction:column; gap:24px; }
.bbm-field { display:flex; flex-direction:column; gap:8px; }
.bbm-field label, .legend { font-size:15px; line-height:20px; font-weight:700; padding:0; }
.bbm-field input, .bbm-field textarea { font:inherit; font-size:16px; line-height:24px; color:var(--ink); background:var(--surface); border:1.5px solid var(--border-strong); border-radius:var(--radius-sm); padding:10px 12px; width:100%; }
.bbm-field textarea { min-height:112px; resize:vertical; }
.bbm-field-foot { display:flex; justify-content:space-between; gap:12px; font-size:14px; line-height:20px; color:var(--ink-muted); }
.bbm-count { font-variant-numeric:tabular-nums; white-space:nowrap; }
.bbm-count.is-ok { color:var(--good); font-weight:700; }
.bbm-field.is-invalid input, .bbm-field.is-invalid textarea { border-color:var(--critical); }
.bbm-field-error { font-size:14px; line-height:20px; color:var(--critical); background:var(--critical-tint); border-radius:var(--radius-sm); padding:8px 12px; }
.bbm-options { display:flex; flex-direction:column; gap:8px; border:0; margin:0; padding:0; min-width:0; }
.bbm-option { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; align-items:start; padding:12px 16px; border:1.5px solid var(--border-strong); border-radius:var(--radius-md); background:var(--surface); cursor:pointer; }
.bbm-option input { margin:3px 0 0; width:20px; height:20px; accent-color:var(--primary); grid-row:1 / span 2; }
.bbm-option-name { font-weight:700; }
.bbm-option-desc { font-size:14px; line-height:20px; color:var(--ink-muted); grid-column:2; }
.bbm-option.is-checked { border-color:var(--primary); background:var(--primary-tint); }
.bbm-check { display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:12px 16px; border-radius:var(--radius-sm); background:var(--surface-sunken); cursor:pointer; min-height:44px; }
.bbm-check input { width:22px; height:22px; margin:1px 0 0; accent-color:var(--primary); }

/* Summary rows */
.sum-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.sum-row:last-child { border-bottom:0; }
.sum-row .main { display:flex; flex-direction:column; min-width:0; }

/* Kit */
.copy-box { padding:14px 16px; background:var(--surface-sunken); border-radius:var(--radius-sm); white-space:pre-wrap; overflow-wrap:anywhere; }
.video-tile { width:120px; height:213px; flex:none; border-radius:var(--radius-md); background:var(--brand-plum); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; }
ol.steps-list { margin:0; padding-left:22px; display:flex; flex-direction:column; gap:4px; }
details.shotlist { border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 16px; background:var(--surface); }
details.shotlist summary { font-weight:700; cursor:pointer; }
details.shotlist ul { margin:8px 0 0; padding-left:18px; font-size:15px; }
code { font-size:13px; background:var(--surface-sunken); padding:1px 6px; border-radius:6px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom, 0px)); width:max-content; max-width:calc(100% - 32px); text-align:center; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:16px; font-weight:700; font-size:15px; line-height:22px; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.2); }
@media (prefers-reduced-motion: reduce) { .bbm-shot-bar span { transition:none; } }
@media (min-width: 600px) { .bbm-card { padding:var(--space-5); } }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in" id="topbar"></div></header>
<main id="app" aria-live="polite"><p class="meta">Loading…</p></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ==========================================================================
   BRAND BOOSTER MEDIA — OFFICIAL EDITOR BRIEF GENERATOR  (v1.0)
   Source of truth: Master Spec (locked Oct 11, 2026) + Official Brief Templates.
   Toolkit assumed: Adobe Premiere Pro + After Effects (Motion Graphics
   Templates), BB Template Library, BB Music Library, BB export presets.
   buildBrief(formType, data) -> plain-text brief emailed to the editor.
   ========================================================================== */
(function (root) {
  'use strict';

  var LIBRARY = 'BB Template Library';

  // Form music / style choices -> BB Music Library folders
  var MUSIC = {
    warm: 'BB_Music/01_Warm_Acoustic',
    electro: 'BB_Music/02_Upbeat_Electronic',
    driving: 'BB_Music/03_Driving_Electronic',
    pop: 'BB_Music/04_Upbeat_Pop',
    ambient: 'BB_Music/05_Light_Ambient',
    cinematic: 'BB_Music/06_Cinematic',
    playful: 'BB_Music/07_Playful',
    inspire: 'BB_Music/08_Inspirational',
    sitcom: 'BB_Music/09_Sitcom_Theme'
  };

  function val(d, key, label) {
    var x = d && d[key] != null ? String(d[key]).trim() : '';
    return x || '[MISSING: ' + (label || key) + ']';
  }
  function has(d, key, needle) {
    return String((d && d[key]) || '').toLowerCase().indexOf(needle.toLowerCase()) !== -1;
  }
  function q(s) { return '"' + s + '"'; }
  function captionPreset(choice) {
    return /kinetic/i.test(choice || '') ? 'BB_Captions_Kinetic' : 'BB_Captions_Minimal';
  }
  function slug(s) {
    return String(s || 'Site').replace(/[^A-Za-z0-9]+/g, '').slice(0, 24) || 'Site';
  }

  /* ---------------- Per-video specs ---------------- */
  var SPECS = {

    day_in_the_life: function (d) {
      var site = val(d, 'siteName', 'Site Name');
      var story = has(d, 'videoStyle', 'storyteller');
      var music = has(d, 'musicEnergy', 'electronic') ? MUSIC.electro : MUSIC.warm;
      var m = [1, 2, 3, 4].map(function (i) { return val(d, 'activity' + i, 'Milestone ' + i + ' banner'); });
      var spec = {
        obj: 'Obj-1', short: 'DayInTheLife', title: 'Objective 1 — "Day in the Life" Student Journey',
        length: '28 s', frame: '9:16', template: 'BB_01_DayInTheLife',
        footage: [
          ['Obj-1_Shot_1', '0:00–0:03', 'Milestone 1, angle A'],
          ['Obj-1_Shot_2', '0:03–0:06', 'Milestone 1, angle B'],
          ['Obj-1_Shot_3', '0:06–0:09', 'Milestone 2, angle A'],
          ['Obj-1_Shot_4', '0:09–0:12', 'Milestone 2, angle B'],
          ['Obj-1_Shot_5', '0:12–0:15', 'Milestone 3, angle A'],
          ['Obj-1_Shot_6', '0:15–0:18', 'Milestone 3, angle B'],
          ['Obj-1_Shot_7', '0:18–0:21', 'Milestone 4, angle A'],
          ['Obj-1_Shot_8', '0:21–0:24', 'Milestone 4, angle B']
        ],
        text: [
          ['BB_Hook_Title', q('A Day at ' + site)],
          ['BB_Timestamp_Badge #1', q(m[0])],
          ['BB_Timestamp_Badge #2', q(m[1])],
          ['BB_Timestamp_Badge #3', q(m[2])],
          ['BB_Timestamp_Badge #4', q(m[3])],
          ['BB_Outro_Logo_4s · CTA line', q('Come spend a day with us')]
        ],
        timeline: [
          ['0:00–0:03', 'Shot 1', 'BB_Hook_Title + Badge #1', story ? 'Voiceover starts; music under' : 'Music in at full level'],
          ['0:03–0:06', 'Shot 2', 'Badge #1', story ? 'Voiceover' : 'Music; room sound at 10%'],
          ['0:06–0:12', 'Shots 3–4', 'Badge #2', story ? 'Voiceover' : 'Same'],
          ['0:12–0:18', 'Shots 5–6', 'Badge #3', story ? 'Voiceover' : 'Same'],
          ['0:18–0:24', 'Shots 7–8', 'Badge #4', story ? 'Voiceover ends' : 'Same'],
          ['0:24–0:28', 'Outro', 'BB_Outro_Logo_4s', 'Music resolves']
        ],
        audio: [
          'Music: ' + music + ' (form choice: ' + val(d, 'musicEnergy', 'Soundtrack') + '). Fit to 28.0 s with Remix.',
          story ? 'Voiceover on top; music −18 dB under it.' : 'Room sound from clips at 10% under the music.'
        ],
        captions: story ? 'BB_Captions_Minimal, synced to the voiceover.' : 'None (no speech).',
        rules: ['Straight 3.0 s cuts, no transitions.', 'Badge #1 animates in on frame 1 under the hook title.'],
        script: []
      };
      if (story) {
        spec.footage.push(['Obj-1_Voiceover', '0:00–0:24', 'Professional VO recorded from the SCRIPT section']);
        spec.script.push(['Voiceover script (55–65 words)', val(d, 'voScript', 'Voiceover script')]);
      }
      return spec;
    },

    testimonials: function (d) {
      var wide = has(d, 'videoOrientation', '16:9');
      return {
        obj: 'Obj-2', short: 'Testimonial', title: 'Objective 2 — Parent & Student Testimonials',
        length: '31 s', frame: wide ? '16:9' : '9:16', template: wide ? 'BB_02_Testimonial_16x9' : 'BB_02_Testimonial_9x16',
        footage: [
          ['Obj-2_Shot_1', '0:00–0:31 (A-roll)', 'Interview, one take: Before · Since starting · Recommendation'],
          ['Obj-2_Shot_2', '0:03–0:12', 'B-roll under the "Before" section'],
          ['Obj-2_Shot_3', '0:12–0:20', 'B-roll under "Since starting"'],
          ['Obj-2_Shot_4', '0:20–0:27', 'B-roll under the recommendation']
        ],
        text: [
          ['BB_Metric_Hook', q(val(d, 'outcomeMetric', 'Outcome metric'))],
          ['BB_LowerThird · line 1', q(val(d, 'speakerName', 'Subject credentials'))],
          ['BB_Outro_Logo_4s · CTA line', q('Join our families')],
          ['BB_Outro_Logo_4s · URL override', q(val(d, 'programWebsite', 'Program website'))]
        ],
        timeline: [
          ['0:00–0:03', 'Shot 1', 'BB_Metric_Hook + BB_LowerThird', 'Speech'],
          ['0:03–0:12', 'Shot 1 → Shot 2', '"Before" section', 'Speech continues under B-roll'],
          ['0:12–0:20', 'Shot 3 → Shot 1', '"Since starting" section', 'Speech continues'],
          ['0:20–0:27', 'Shot 4 → Shot 1', 'Recommendation line', 'Speech continues'],
          ['0:27–0:31', 'Outro', 'BB_Outro_Logo_4s (program URL)', 'Warm music bed']
        ],
        audio: [
          'Voice: Enhance Speech, then Essential Sound > Dialogue preset.',
          'Music: ' + MUSIC.warm + ', −20 dB under speech; fit to 31.0 s with Remix.'
        ],
        captions: captionPreset(d.captionStyle) + ' (form choice: ' + val(d, 'captionStyle', 'Caption style') + '). Proofread against the SCRIPT section.',
        rules: ['If the speaker strays from the script, keep their words; match captions to what was said.'],
        script: [
          ['Before (0:00–0:12, 25–30 words)', val(d, 'beforeObstacle', 'Before section')],
          ['Since starting (0:12–0:20, 17–20 words)', val(d, 'sinceStarting', 'Since starting section')],
          ['Recommendation (0:20–0:27, 15–17 words)', val(d, 'recommendationLine', 'Recommendation line')]
        ]
      };
    },

    staff_spotlight: function (d) {
      return has(d, 'spotlightType', 'staff') ? SPECS._sitcom(d) : SPECS._teacher(d);
    },

    _teacher: function (d) {
      return {
        obj: 'Obj-3', short: 'TeacherSpotlight', title: 'Objective 3A — Teacher Spotlight',
        length: '28–32 s (follows the statement)', frame: '9:16', template: 'BB_03A_TeacherSpotlight',
        footage: [
          ['Obj-3_Shot_1', '0:00–0:04, 0:10–0:16, 0:22–end', 'Statement to camera (~25 s)'],
          ['Obj-3_Shot_2', '0:04–0:10', 'Teaching B-roll'],
          ['Obj-3_Shot_3', '0:16–0:22', 'Teaching B-roll']
        ],
        text: [
          ['BB_LowerThird · line 1', q(val(d, 'staffName', 'Staff credentials'))],
          ['BB_Quote_Overlay', q(val(d, 'teacherSummary', 'Teaching philosophy'))],
          ['BB_Outro_Logo_4s · CTA line', q('Meet our team')]
        ],
        timeline: [
          ['0:00–0:04', 'Shot 1', 'BB_LowerThird (hook)', 'Speech'],
          ['0:04–0:10', 'Shot 2', 'BB_Quote_Overlay', 'Speech continues'],
          ['0:10–0:16', 'Shot 1', 'Captions', 'Speech'],
          ['0:16–0:22', 'Shot 3', 'Captions', 'Speech continues'],
          ['0:22–end of statement', 'Shot 1', 'Captions', 'Speech'],
          ['Last 4 s', 'Outro', 'BB_Outro_Logo_4s', 'Warm music bed']
        ],
        audio: ['Voice: Enhance Speech + Dialogue preset.', 'Music: ' + MUSIC.warm + ', −18 dB under speech.'],
        captions: 'BB_Captions_Minimal. Proofread against the SCRIPT section.',
        rules: ['Gentle push-in (100% → 108%) on both B-roll shots.'],
        script: [['Statement (60–70 words, ~25 s)', val(d, 'scriptStatement', 'Statement')]]
      };
    },

    _sitcom: function (d) {
      var site = val(d, 'siteName', 'Site Name');
      var s = [1, 2, 3, 4].map(function (i) { return val(d, 'staff' + i, 'Staff ' + i + ' banner'); });
      return {
        obj: 'Obj-3', short: 'StaffSitcom', title: 'Objective 3B — Staff Spotlight: 90s Sitcom Intro',
        length: '30 s', frame: '9:16', template: 'BB_03B_StaffSitcom',
        footage: [
          ['Obj-3_Shot_1', '0:02–0:05', 'Arrival — Staff 1 & 4'],
          ['Obj-3_Shot_2', '0:05–0:08', 'Active play — Staff 1'],
          ['Obj-3_Shot_3', '0:08–0:11', 'Learning — Staff 2 & 3'],
          ['Obj-3_Shot_4', '0:11–0:14', 'INTRO pair 1 — Staff 2 & 3 wave'],
          ['Obj-3_Shot_5', '0:14–0:17', 'Enrichment — Staff 2 & 3'],
          ['Obj-3_Shot_6', '0:17–0:20', 'Dismissal — Staff 4'],
          ['Obj-3_Shot_7', '0:20–0:23', 'INTRO pair 2 — Staff 1 & 4'],
          ['Obj-3_Shot_8', '0:23–0:26', 'Group finale — all four']

    L.push('');
    L.push('=== TEXT FIELDS (Essential Graphics panel — type exactly) ===');

    spec.timeline.forEach(function (r) { L.push(pad(r[0], 22) + ' | ' + pad(r[1], 28) + ' | ' + pad(r[2], 40) + ' | ' + r[3]); });

  }

  var STEP_TITLE = { film: 'What to film', clips: 'Add your clips', details: 'Details', send: 'Check & send' };
  function rulesFor(t, v) {

  }
  function clipCount(t) { var s = shotsFor(t, {}); return s.req.length + s.atLeast; }
  function shotTitle(s) { return typeof s.n === 'number' ? 'Shot ' + s.n : s.n; }
  function isImageOnly(s) { return /image/.test(s.accept || '') && !/video/.test(s.accept || ''); }

  // ---------- field rendering + validation ----------
  function fieldError(f, val) {
    val = String(val || '').trim();
    if (!val) return f.type === 'choice' ? 'Please choose one.' : 'Please fill this in.';
    if (f.words) {
      var n = countWords(val), lo = f.words[0], hi = f.words[1];
      if (n < lo) return 'Please use at least ' + lo + ' words (now ' + n + ').';
      if (n > hi) return 'Please keep it to ' + hi + ' words or fewer (now ' + n + ').';
    }
    if (f.type === 'url' && !/^(https?:\/\/)?[^\s.\/]+(\.[^\s.\/]+)+(\/\S*)?$/i.test(val)) return 'Please enter a website address, like yourprogram.com.';
    return '';
  }
  function countHtml(f, val) {
    if (!f.words) return '';
    var n = countWords(val), ok = n >= f.words[0] && n <= f.words[1];
    var range = f.words[0] === 1 ? 'up to ' + f.words[1] : f.words[0] + '–' + f.words[1];
    return '<span class="bbm-count' + (ok ? ' is-ok' : '') + '">' + n + ' of ' + range + ' words</span>';
  }
  function fieldHtml(f, v, err) {
    var id = 'f_' + f.name, val = v[f.name] || '';
    if (f.type === 'choice') {
      return '<fieldset class="bbm-field bbm-options' + (err ? ' is-invalid' : '') + '" data-field="' + f.name + '"><legend class="legend">' + esc(f.label) + '</legend>'
        + f.options.map(function (o, i) {
          var on = val === o.value;
          return '<label class="bbm-option' + (on ? ' is-checked' : '') + '"><input type="radio" name="' + f.name + '" value="' + esc(o.value) + '"' + (on ? ' checked' : '') + (i === 0 ? ' id="' + id + '"' : '') + '>'
            + '<span class="bbm-option-name">' + esc(o.label) + '</span>' + (o.desc ? '<span class="bbm-option-desc">' + esc(o.desc) + '</span>' : '') + '</label>';
        }).join('')
        + (err ? '<p class="bbm-field-error">' + esc(err) + '</p>' : '') + '</fieldset>';
    }
    var input = f.type === 'textarea'
      ? '<textarea id="' + id + '" name="' + f.name + '" rows="4">' + esc(val) + '</textarea>'
      : '<input id="' + id + '" name="' + f.name + '" type="' + (f.type === 'url' ? 'url' : 'text') + '" value="' + esc(val) + '"' + (f.type === 'url' ? ' inputmode="url" autocapitalize="off"' : '') + ' autocomplete="off">';
    return '<div class="bbm-field' + (err ? ' is-invalid' : '') + '" data-field="' + f.name + '"><label for="' + id + '">' + esc(f.label) + '</label>' + input
      + '<div class="bbm-field-foot"><span>' + esc(f.example || '') + '</span>' + countHtml(f, val) + '</div>'
      + (err ? '<p class="bbm-field-error">' + esc(err) + '</p>' : '') + '</div>';
  }
  // Wire inputs inside `root`: text updates in place; choices re-render (they can show or hide other fields).
  function bindFields(root, fields, t, d, rerender, onText) {
    root.querySelectorAll('input[type=text], input[type=url], textarea').forEach(function (el) {
      el.addEventListener('input', function () {
        d.vals[el.name] = el.value; saveDraft(t, d);
        var f = fields.filter(function (x) { return x.name === el.name; })[0], box = el.closest('.bbm-field');
        if (f && f.words) box.querySelector('.bbm-field-foot').innerHTML = '<span>' + esc(f.example || '') + '</span>' + countHtml(f, el.value);
        if (box.classList.contains('is-invalid') && f && !fieldError(f, el.value)) { box.classList.remove('is-invalid'); var e = box.querySelector('.bbm-field-error'); if (e) e.remove(); }
        if (onText) onText();
      });
    });
    root.querySelectorAll('input[type=radio]').forEach(function (el) {
      el.addEventListener('change', function () { d.vals[el.name] = el.value; saveDraft(t, d); rerender(); });
    });
  }
  function validate(fields, v) {
    var errs = {}; fields.forEach(function (f) { var e = fieldError(f, v[f.name]); if (e) errs[f.name] = e; }); return errs;
  }
  function focusFirstError() {
    var el = app.querySelector('.is-invalid');
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); var i = el.querySelector('input, textarea'); if (i) setTimeout(function () { i.focus({ preventScroll: true }); }, 300); }
  }

  // ---------- upload engine (resumable, 8 MiB chunks, up to 3 at once) ----------
  var UP = {};            // 'draft|shot' -> { state: queued|uploading|done|failed, pct, msg, name, size }
  var queue = [], running = 0, wakeLock = null;
  function upKey(draft, shot) { return draft + '|' + shot; }
  function activeUploads() { return Object.keys(UP).filter(function (k) { var s = UP[k].state; return s === 'queued' || s === 'uploading'; }).length; }
  function notify(draft, shot) {
    if (notify.any) notify.any();   // first, so a finished clip is saved before its slot repaints
    var cb = notify.listeners[upKey(draft, shot)]; if (cb) cb(UP[upKey(draft, shot)]);
  }
  notify.listeners = {};
  function wake() {
    if (wakeLock || !('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && running) wake(); });
  window.addEventListener('beforeunload', function (e) { if (activeUploads()) { e.preventDefault(); e.returnValue = ''; } });
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // Read a clip's length and shape on the phone, before it uploads (best effort).
  function probe(file) {
    return new Promise(function (resolve) {
      if (!/^video\//.test(file.type || 'video/')) return resolve(null);
      var v = document.createElement('video'), url, done = false;
      var finish = function (r) { if (done) return; done = true; try { URL.revokeObjectURL(url); } catch (e) {} resolve(r); };
      v.preload = 'metadata'; v.muted = true;
      v.onloadedmetadata = function () { finish({ dur: isFinite(v.duration) ? v.duration : null, w: v.videoWidth, h: v.videoHeight }); };
      v.onerror = function () { finish(null); };
      setTimeout(function () { finish(null); }, 5000);
      try { url = URL.createObjectURL(file); v.src = url; } catch (e) { finish(null); }
    });
  }

  function enqueue(draft, shot, file, onStarted) {
    var k = upKey(draft, shot);
    UP[k] = { state: 'queued', pct: 0, msg: 'Waiting to upload…', name: file.name, size: file.size };
    notify(draft, shot);
    queue.push({ draft: draft, shot: shot, file: file, onStarted: onStarted });
    pump();
  }
  function pump() {
    while (running < PARALLEL && queue.length) {
      var job = queue.shift(); running++; wake();
      runUpload(job).then(done, done);
    }
    function done() { running--; if (!running && !queue.length && wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; } pump(); }
  }
  // Upload log, kept on the phone so a franchisee can copy it for support ("Copy upload details").
  var LOG = readJSON('bbUpLog') || [];
  function ulog(msg) {
    var now = new Date();
    LOG.push(now.toISOString().slice(5, 19).replace('T', ' ') + '  ' + msg);
    if (LOG.length > 200) LOG = LOG.slice(-200);
    storeJSON('bbUpLog', LOG);
  }
  function logText() {
    var c = navigator.connection;
    return ['Device: ' + navigator.userAgent, 'Network now: ' + (navigator.onLine ? 'online' : 'offline') + (c ? ' · ' + (c.effectiveType || '?') + (c.downlink ? ' ~' + c.downlink + ' Mbps' : '') : ''), ''].concat(LOG).join('\n');
  }
  function waitOnline() {
    if (navigator.onLine !== false) return Promise.resolve();
    return new Promise(function (res) {
      var t = setTimeout(done, 10 * 60 * 1000);
      function done() { clearTimeout(t); window.removeEventListener('online', done); res(); }
      window.addEventListener('online', done);
    });
  }
  // fetch with a time limit, so a stalled connection is retried instead of hanging forever
  function fetchT(url, opts, ms) {
    if (!window.AbortController) return fetch(url, opts);
    var ac = new AbortController(), t = setTimeout(function () { ac.abort(); }, ms);
    return fetch(url, Object.assign({}, opts, { signal: ac.signal })).then(function (r) { clearTimeout(t); return r; }, function (e) {
      clearTimeout(t); throw new Error(e && e.name === 'AbortError' ? 'no response for ' + Math.round(ms / 1000) + ' s' : (e && e.message) || 'network error');
    });
  }
  function runUpload(job) {
    var k = upKey(job.draft, job.shot), f = job.file, rec = 'bbUp_' + job.draft + '_' + job.shot, tag = job.shot.replace(/^Obj-\d+_/, '');
    var saved = readJSON(rec), resume = !!(saved && saved.size === f.size && saved.name === f.name && saved.url);
    var url, offset = 0, base = 0, retries = 0, restarts = 0, chunk = CHUNK, started = Date.now();
    function set(o) { Object.assign(UP[k], o); notify(job.draft, job.shot); }
    function pct() { return Math.floor(100 * Math.max(0, offset) / f.size); }
    set({ state: 'uploading', pct: 0, msg: resume ? 'Carrying on where it stopped…' : 'Starting…' });
    ulog(tag + ': ' + f.name + ', ' + mb(f.size) + ', ' + (f.type || 'no type') + (resume ? ', resuming' : ''));

    function codeOf(r) { return Number(r.headers.get('X-Http-Status-Code-Override')) || r.status; }
    function driveErr(code) { var e = new Error('Drive answered ' + code); e.code = code; return e; }
    // Ask Drive how much it has: -1 = complete, otherwise the next byte to send.
    function status() {
      return fetchT(url, { method: 'PUT', headers: { 'Content-Range': 'bytes */' + f.size, 'X-GUploader-No-308': 'yes' } }, 30000).then(function (r) {

        if (code !== 308) throw driveErr(code);
        var range = r.headers.get('Range');
        return range ? Number(range.split('-')[1]) + 1 : 0;
      });
    }
    function start(attempt) {
      attempt = attempt || 1;
      return fetchT(SCRIPT_URL, { method: 'POST', body: formData({ action: 'uploadStart', siteKey: KEY, draftId: job.draft, shot: job.shot, fileName: f.name, mimeType: f.type || 'video/quicktime', size: String(f.size) }) }, 45000)
        .then(function (r) { return r.json().catch(function () { throw new Error('portal busy (HTTP ' + r.status + ')'); }); })
        .then(function (d) {
          if (d.result !== 'success') throw serverError(d.message || 'The upload could not start.');
          if (job.onStarted) job.onStarted(d);
          ulog(tag + ': upload opened');
          return d.uploadUrl;
        })
        .catch(function (e) {

        });
    }
    function startOver(why) {
      if (++restarts > 2) throw new Error(why);
      ulog(tag + ': ' + why + ', starting this clip again');
      store(rec, null); offset = 0; base = 0;
      return start().then(function (u) { url = u; storeJSON(rec, { url: url, size: f.size, name: f.name, offset: 0 }); });
    }
    function loop() {
      if (offset === -1 || offset >= f.size) return finish();
      var end = Math.min(offset + chunk, f.size), len = end - offset;
      return fetchT(url, { method: 'PUT', headers: { 'Content-Range': 'bytes ' + offset + '-' + (end - 1) + '/' + f.size, 'X-GUploader-No-308': 'yes' }, body: f.slice(offset, end) },
                    30000 + Math.round(len / 40))   // allow ~40 KB/s before calling it stalled
        .then(function (r) {
          var code = codeOf(r);
          if (code === 200 || code === 201) { offset = f.size; return 'done'; }
          if (code !== 308) throw driveErr(code);
          var range = r.headers.get('Range');
          offset = range ? Number(range.split('-')[1]) + 1 : end;
          retries = 0;
          storeJSON(rec, { url: url, size: f.size, name: f.name, offset: offset });
          var secs = Math.max(1, (Date.now() - started) / 1000);
          set({ pct: pct(), msg: 'Uploading · ' + mb(offset) + ' of ' + mb(f.size) + ' · ' + ((offset - base) / 1048576 / secs).toFixed(1) + ' MB/s' });
          return 'next';
        }, function (err) { return { err: err }; })
        .then(function (r) {
          if (r === 'done') return finish();
          if (r === 'next') return loop();
          var err = r.err || r;
          return recover(err);
        }, recover);
    }
    // Something went wrong mid-clip: wait, ask Drive how much arrived, and carry on from there.
    function recover(err) {
      if (err && (err.code === 404 || err.code === 410)) return startOver('upload link expired').then(loop);
      if (++retries > 10) throw err;
      if (chunk > 2 * 1048576) { chunk = 2 * 1048576; ulog(tag + ': switching to smaller pieces'); }
      var wait = Math.min(30, Math.pow(2, retries - 1));

      set({ msg: navigator.onLine === false ? 'Waiting for a connection…' : 'Connection dropped at ' + pct() + '%. Retrying in ' + wait + ' s…' });
      return sleep(wait * 1000).then(waitOnline).then(status).then(function (o) {
        offset = o === -1 ? f.size : o; return loop();
      }, function (e2) {
        ulog(tag + ': progress check failed: ' + e2.message);
        if (e2.code === 404 || e2.code === 410) return startOver('upload link expired').then(loop);
        return loop();
      });
    }
    function finish() {
      store(rec, null);
      var secs = Math.max(1, (Date.now() - started) / 1000);
      ulog(tag + ': done in ' + Math.round(secs) + ' s (' + ((f.size - base) / 1048576 / secs).toFixed(1) + ' MB/s)');
      set({ state: 'done', pct: 100, msg: 'Added' });
    }
    return (resume ? Promise.resolve(saved.url) : start()).then(function (u) {
      url = u;
      if (!resume) { storeJSON(rec, { url: url, size: f.size, name: f.name, offset: 0 }); return; }
      return status().then(function (o) { offset = o === -1 ? f.size : o; base = Math.max(0, offset); ulog(tag + ': Drive already had ' + mb(base)); },
        function (e) { return startOver('could not resume (' + e.message + ')'); });
    }).then(loop).catch(function (err) {
      var why = err && err.fromServer ? err.message : (err && err.message) || 'unknown error';
      ulog(tag + ': STOPPED at ' + pct() + '%: ' + why);
      set({ state: 'failed', msg: err && err.fromServer ? err.message
        : 'Upload stopped at ' + pct() + '% (' + why + '). Tap Try again and pick the same clip: it carries on from there.' });
    });
  }

  // One shot slot (used by step 2 and by "Needs a fix").
  // opts: { draft, shot, onFile(file, probeResult), what, min, horizontalOk, uploaded: {name,size,dur} | null, problem }
  function slotHtml(s, opts) {
    var accept = s.accept || 'video/*';
    return '<div class="bbm-shot" id="slot-' + esc(s.shot) + '" data-shot="' + esc(s.shot) + '">'
      + '<p class="bbm-shot-name">' + esc(opts.title || shotTitle(s) + ' · ' + s.what) + '</p>'
      + '<p class="bbm-shot-what"></p>'
      + '<span class="bbm-shot-action"><label class="bbm-btn bbm-btn-sm file-btn"><span>Add clip</span><input type="file" accept="' + esc(accept) + '" aria-label="Add a clip for ' + esc(shotTitle(s)) + '"></label></span>'
      + '<div class="bbm-shot-bar" hidden><span></span></div></div>';
  }
  function bindSlot(root, s, opts) {
    var el = root.querySelector('[id="slot-' + s.shot + '"]'); if (!el) return;
    var what = el.querySelector('.bbm-shot-what'), btn = el.querySelector('label span'), barBox = el.querySelector('.bbm-shot-bar'), barIn = barBox.querySelector('span');
    var input = el.querySelector('input');
    function paint() {
      var u = UP[upKey(opts.draft, s.shot)], rec = opts.uploaded && opts.uploaded();
      el.classList.remove('is-done', 'is-failed', 'is-problem');
      barBox.hidden = true;
      if (u && (u.state === 'queued' || u.state === 'uploading')) {
        what.textContent = u.msg; btn.textContent = u.pct + '%'; barBox.hidden = false; barIn.style.width = u.pct + '%';
      } else if (u && u.state === 'failed') {
        el.classList.add('is-failed'); what.textContent = u.msg; btn.textContent = 'Try again';
      } else if (rec) {
        var warn = opts.warnFor ? opts.warnFor(rec) : '';
        el.classList.add(warn ? 'is-problem' : 'is-done');
        what.textContent = warn || (opts.doneText ? opts.doneText(rec) : 'Added');
        btn.textContent = 'Replace';
      } else {
        var saved = readJSON('bbUp_' + opts.draft + '_' + s.shot);
        what.textContent = saved && saved.size ? 'Stopped at ' + Math.round(100 * saved.offset / saved.size) + '%. Pick the same clip to carry on.' : (opts.emptyText || (s.min ? s.min + ' s or more' : 'Photo or clip'));
        if (opts.problem) { el.classList.add('is-problem'); what.textContent = opts.problem; }

      var u = UP[upKey(opts.draft, s.shot)];
      if (u && (u.state === 'queued' || u.state === 'uploading')) { toast('That clip is still uploading'); return; }
      probe(f).then(function (info) { opts.onFile(f, info); });
    });
    paint();
    return paint;
  }

  // ---------- router ----------
  window.addEventListener('hashchange', route);
  function route() {
    notify.listeners = {}; notify.any = null;
    var h = location.hash.replace(/^#\/?/, ''), parts = h.split('/').map(decodeURIComponent);
    window.scrollTo(0, 0);
    if (!KEY) return renderSignUp();
    if (parts[0] === 'v' && VIDEOS[parts[1]]) return renderStep(parts[1], Number(parts[2]) || 1);
    if (parts[0] === 'order' && parts[1]) return renderOrder(parts[1]);
    if (parts[0] === 'sent' && parts[1]) return renderSent(parts[1]);
    if (parts[0] === 'contentday') return renderContentDay();
    if (parts[0] === 'switch') return renderSwitch();
    renderHome();
  }
  function go(h) { if (location.hash === h) route(); else location.hash = h; }

  // ---------- sign-up (no personal link yet) ----------
  function renderSignUp(msg) {
    topHome();
    app.innerHTML = '<section class="group"><h1>Your video portal</h1><p class="meta">Each week it shows you one video to film, then turns your phone clips into a finished video for your Band.</p></section>'
      + (msg ? '<p class="bbm-notice bad">' + esc(msg) + '</p>' : '')
      + '<form class="bbm-card form" id="signup" novalidate><h2>Request your personal link</h2>'
      + '<input type="text" name="bb_hp" tabindex="-1" autocomplete="off" aria-hidden="true" hidden>'
      + '<div class="bbm-field"><label for="su_site">Your site</label><input id="su_site" name="siteName" type="text" autocomplete="organization" placeholder="e.g. Monterey"></div>'
      + '<div class="bbm-field"><label for="su_name">Your name</label><input id="su_name" name="name" type="text" autocomplete="name"></div>'
      + '<div class="bbm-field"><label for="su_email">Your email</label><input id="su_email" name="email" type="email" autocomplete="email" inputmode="email"></div>'
      + '<p class="bbm-field-error" id="su_err" hidden></p>'
      + '<button class="bbm-btn bbm-btn-primary bbm-btn-block" type="submit">Request access</button>'
      + '<p class="meta">We usually approve within one working day and email your link.</p></form>'
      + '<p class="meta">Already approved? Open the link in your welcome email, then bookmark it or add it to your home screen.</p>';
    var f = document.getElementById('signup'), err = document.getElementById('su_err');
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = { action: 'signup', siteName: f.siteName.value.trim(), name: f.name.value.trim(), email: f.email.value.trim(), bb_hp: f.bb_hp.value };
      if (!v.siteName || !v.name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) { err.hidden = false; err.textContent = 'Please fill in your site, your name and a valid email address.'; return; }
      var btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Sending…'; err.hidden = true;
      post(v).then(function (d) {
        if (d.result !== 'success') throw serverError(d.message);
        f.outerHTML = '<div class="bbm-notice good">Thanks! We\'ll email your personal link to <strong>' + esc(v.email) + '</strong> once your site is approved.</div>';
      }).catch(function (e2) { err.hidden = false; err.textContent = netMsg(e2, 'That'); btn.disabled = false; btn.textContent = 'Request access'; });
    });
  }

  function renderSwitch() {
    topBack('#home', 'Switch site');
    var site = PROFILE ? PROFILE.site : 'this site';
    app.innerHTML = '<section class="group"><h1>Not ' + esc(site) + '?</h1><p>This phone is set up for <strong>' + esc(site) + '</strong>. To use another site, open that site\'s personal link from its welcome email.</p>'
      + '<p class="meta">Signing out removes the link and any unsent drafts from this phone.</p>'
      + '<button class="bbm-btn bbm-btn-block" id="signout">Sign out of ' + esc(site) + '</button></section>';
    document.getElementById('signout').addEventListener('click', function () {
      Object.keys(localStorage).forEach(function (k) { if (/^bb(Draft_|Up_)/.test(k)) store(k, null); });
      ['bbSiteKey', 'bbProfile', 'bbHome'].forEach(function (k) { store(k, null); });
      KEY = null; PROFILE = null; HOME = null;
      history.replaceState(null, '', location.pathname); route();
    });
  }

  // ---------- home ----------
  function renderHome() {
    topHome();
    if (HOME) paintHome(HOME, false); else app.innerHTML = '<p class="meta">Loading your plan…</p>';
    get({ api: 'home', s: KEY }).then(function (d) {
      if (d.result !== 'ok') {
        ['bbSiteKey', 'bbProfile', 'bbHome'].forEach(function (k) { store(k, null); });
        KEY = null; PROFILE = null; HOME = null; return renderSignUp(d.message);
      }
      HOME = d; PROFILE = d.profile; storeJSON('bbHome', d); storeJSON('bbProfile', d.profile);
      if (!location.hash || location.hash === '#home') paintHome(d, true);
    }).catch(function () {
      if (!location.hash || location.hash === '#home') {
        if (HOME) paintHome(HOME, false, 'You\'re offline or the portal is busy, so this may be out of date. Drafts and clip uploads still work when you\'re back online.');
        else app.innerHTML = '<p class="bbm-notice warn">We couldn\'t load your portal right now. Check your connection and refresh the page.</p>';
      }

      h += '</div>';
      h += '<section class="group"><h2>Before you send</h2>'
        + '<label class="bbm-check"><input type="checkbox" id="c1"><span>Every child who can be identified in my footage is covered by a <strong>signed media release</strong> kept on file at our site.</span></label>'
        + '<label class="bbm-check"><input type="checkbox" id="c2"><span>I filmed following the <strong>filming standard</strong> in step 1' + (d.mode === 'drive' ? ' and named my files as listed' : '') + '.</span></label></section>';
      if (msg) h += '<p class="bbm-field-error" id="senderr">' + esc(msg) + '</p>';
      h += '<div class="stack-8"><button class="bbm-btn bbm-btn-primary bbm-btn-block" id="send">Send my order</button>'
        + '<p class="meta center">We check your clips within a few minutes. If anything needs fixing, you\'ll see it on Home and get an email.</p></div>';
      app.innerHTML = h;
      var c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
      c1.checked = !!paint.c1; c2.checked = !!paint.c2;
      c1.addEventListener('change', function () { paint.c1 = c1.checked; }); c2.addEventListener('change', function () { paint.c2 = c2.checked; });
      document.getElementById('send').addEventListener('click', function () {
        if (sending) return;
        var problem = filmErr ? 'Please finish step ' + iFilm + ' (what to film).'
          : !clipsOk ? (d.mode === 'drive' ? 'Please add your Google Drive folder link in step ' + iClips + '.' : st.busy ? 'Please wait for your clips to finish uploading.' : 'Please add ' + (st.missing.length ? 'the missing clips' : 'at least ' + st.s.atLeast + ' clips') + ' in step ' + iClips + '.')
          : detErr ? 'Please finish step ' + iDet + ' (details).'
          : !c1.checked || !c2.checked ? 'Please tick both boxes before sending.' : '';
        if (problem) { paint(problem); document.getElementById('senderr').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
        send(t, V, d, this);
      });
      notify.any = function () { syncDone(t, d); if (!sending) rerenderKeepScroll(function () { paint(msg); }); };
    }
    function send(t2, V2, d2, btn) {
      sending = true; btn.disabled = true; btn.textContent = 'Sending…';
      var data = orderData(t2, V2, d2);
      post(Object.assign({}, data, { compiledBrief: B.buildBrief(t2, data), siteKey: KEY, planSlot: d2.slot || '' })).then(function (r) {
        if (r.result === 'error') throw serverError(r.message || 'The order could not be saved.');
        clearDraft(t2, d2);
        store('bbHome', null); HOME = null;
        storeJSON('bbLastSent', { orderId: data.orderId, video: V2.name });
        go('#sent/' + data.orderId);
      }).catch(function (e) {
        sending = false;
        paint(e.fromServer ? 'Your order did not go through: ' + e.message : 'Your order did not go through. Nothing was lost: check your connection and tap Send again.');
      });
    }
    paint();
  }
  function orderData(t, V, d) {
    var v = d.vals, data = { formType: t, bb_hp: '' }, now = new Date();
    visible(V.film, v).concat(visible(V.details, v)).forEach(function (f) {
      var val = String(v[f.name] || '').trim();
      if (f.type === 'url' && val && !/^https?:\/\//i.test(val)) val = 'https://' + val;
      data[f.name] = val;
    });
    data.name = PROFILE ? PROFILE.name : ''; data.email = PROFILE ? PROFILE.email : ''; data.siteName = PROFILE ? PROFILE.site : '';
    data.projectName = V.short + ' · ' + data.siteName + ' · ' + now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    if (d.mode === 'drive') data.fileLink = d.driveLink.trim();
    else { data.fileLink = d.folderUrl || ''; data.uploadDraft = d.draftId; }
    data.consentConfirmed = 'Yes'; data.standardConfirmed = 'Yes';
    data.orderId = B.makeOrderId(now);
    return data;
  }

  function renderSent(id) {
    topHome();
    var last = readJSON('bbLastSent') || {};
    app.innerHTML = '<section class="group center"><span class="bbm-pill bbm-pill-good" style="align-self:center">' + ICON.check + ' Sent</span><h1>Order sent</h1>'
      + '<p>' + esc(last.orderId === id && last.video ? last.video : 'Your video') + ' · order <strong>' + esc(id) + '</strong></p>'
      + '<p class="meta">We\'re checking your clips now. If anything needs fixing, you\'ll see it on Home and get an email. Otherwise it goes straight to our editor.</p></section>'
      + '<div class="stack-8"><a class="bbm-btn bbm-btn-primary bbm-btn-block" href="#home">Back to Home</a><a class="bbm-btn bbm-btn-block" href="#order/' + encodeURIComponent(id) + '">See this order</a></div>';
  }

  // ---------- order screens ----------
  var FLASH = null;   // the result of the last button tap, shown at the top of the order (stays until you leave it)
  function renderOrder(id) {
    topBack('#home', 'Your order');
    app.innerHTML = '<p class="meta">Loading your order…</p>';
    get({ api: 'order', s: KEY, id: id }).then(function (r) {
      if (r.result !== 'ok') throw serverError(r.message || 'We couldn\'t find that order.');
      if (location.hash !== '#order/' + encodeURIComponent(id) && location.hash !== '#order/' + id) return;
      paintOrder(r.order);
      if (FLASH) { app.insertAdjacentHTML('afterbegin', '<p class="bbm-notice ' + FLASH.cls + '" id="flash" role="status">' + esc(FLASH.text) + '</p>'); FLASH = null; }
    }).catch(function (e) {
      app.innerHTML = '<p class="bbm-notice ' + (e.fromServer ? 'bad' : 'warn') + '">' + esc(netMsg(e, 'Loading this order')) + '</p><a class="bbm-btn bbm-btn-block" href="#home">Back to Home</a>';
    });
  }
  function act(o, what, extra, btn) {
    btn.disabled = true; var label = btn.textContent; btn.textContent = 'One moment…';
    return post(Object.assign({ action: 'orderAct', siteKey: KEY, orderId: o.orderId, act: what }, extra || {})).then(function (r) {
      if (r.result !== 'success') throw serverError(r.message);
      store('bbHome', null); HOME = null;
      FLASH = { cls: 'good', text: r.message || 'Done' };
      return r;
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = label;
      var box = document.getElementById('flash'); if (box) box.remove();
      app.insertAdjacentHTML('afterbegin', '<p class="bbm-notice bad" id="flash" role="alert">' + esc(netMsg(e, 'That')) + '</p>');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      throw e;
    });
  }
  function paintOrder(o) {
    var V = VIDEOS[o.formType], name = V ? V.name : o.video, status = o.status;
    var h = '<section class="group">' + pillFor(o.label) + '<h1>' + esc(name) + '</h1><p class="meta">Order ' + esc(o.orderId) + ' · sent ' + esc(o.received) + '</p></section>';
    var after = null;
    if (status === 'Footage Problem') {
      var shots = {}, labels = {}, needMore = false;
      o.problems.concat(o.warnings).forEach(function (p) {
        if (/^We need at least/.test(p.text)) { needMore = true; return; }
        p.shots.forEach(function (s) {
          shots[s] = shots[s] || humanize(p.text);
          var m = /^Missing: \S+ \((.+)\)\.?$/.exec(p.text); if (m) labels[s] = m[1];
        });
      });
      var general = o.problems.filter(function (p) { return !p.shots.length || /^We need at least/.test(p.text); });
      if (needMore && o.draftId) general = general.filter(function (p) { return !/^We need at least/.test(p.text); });
      var fixable = Object.keys(shots);
      if (needMore && o.draftId) h += '<p class="bbm-notice warn">' + esc(o.problems.filter(function (p) { return /^We need at least/.test(p.text); })[0].text.replace(/ named .*?;/, ';')) + ' Add more below.</p><div class="stack-8" id="more"></div>';
      h += '<p class="bbm-notice warn">' + (fixable.length ? fixable.length + ' clip' + (fixable.length === 1 ? ' needs' : 's need') + ' fixing before editing can start. ' : 'Something needs fixing before editing can start. ')
        + (o.draftId ? 'Replace ' + (fixable.length === 1 ? 'it' : 'them') + ' below, then we\'ll check again.' : 'Replace ' + (fixable.length === 1 ? 'it' : 'them') + ' in your footage folder, then tap Check my clips again.') + '</p>';
      if (general.length) h += '<div class="stack-8">' + general.map(function (p) { return '<p class="bbm-notice bad">' + esc(p.text) + '</p>'; }).join('') + '</div>';
      if (fixable.length) {
        h += '<div class="stack-8">' + fixable.map(function (s) {
          var x = findShot(o.formType, s); if (!x.what && labels[s]) x.what = labels[s];
          return o.draftId ? slotHtml(x, { title: shotTitle(x) + (x.what ? ' · ' + x.what : '') })
            : '<div class="bbm-shot is-problem"><p class="bbm-shot-name">' + esc(shotTitle(x) + (x.what ? ' · ' + x.what : '')) + '</p><p class="bbm-shot-what">' + esc(shots[s]) + '</p></div>';
        }).join('') + '</div>';
      }
      if (!o.draftId && o.footageFolder) h += '<a class="bbm-btn bbm-btn-block" href="' + esc(o.footageFolder) + '" target="_blank" rel="noopener">Open your footage folder</a>';
      h += '<div class="stack-8"><button class="bbm-btn bbm-btn-primary bbm-btn-block" id="recheck">Check my clips again</button><p class="meta center" id="recheck-note">Questions? Reply to the email about this order.</p></div>'
        + (o.draftId ? '<button class="bbm-btn bbm-btn-text" id="uplog" style="align-self:center">Trouble uploading? Copy upload details</button>' : '');
      after = function () {
        var replaced = {};
        fixable.forEach(function (s) {
          if (!o.draftId) return;
          var x = findShot(o.formType, s);
          bindSlot(app, x, {
            draft: o.draftId, problem: shots[s],
            uploaded: function () { return replaced[s]; },
            doneText: function () { return 'Replaced'; },
            onFile: function (f) { enqueue(o.draftId, s, f); }
          });
        });
        if (needMore && o.draftId) post({ action: 'uploadList', siteKey: KEY, draftId: o.draftId }).then(function (r) {
          var have = {}; (r.files || []).forEach(function (f) { have[String(f.name).replace(/\.[^.]+$/, '')] = 1; });
          var V = VIDEOS[o.formType], box = document.getElementById('more'); if (!V || !box) return;
          var free = (V.optional ? V.optional({}) : []).filter(function (x) { return !have[x.shot]; });
          box.innerHTML = free.map(function (x) { return slotHtml(x, { title: shotTitle(x) + ' · a candid moment' }); }).join('');
          free.forEach(function (x) {
            bindSlot(app, x, { draft: o.draftId, emptyText: '2 s or more', uploaded: function () { return replaced[x.shot]; }, doneText: function () { return 'Added'; }, onFile: function (f) { enqueue(o.draftId, x.shot, f); } });
          });
        }).catch(function () {});
        var ul = document.getElementById('uplog'); if (ul) ul.addEventListener('click', function () { copyText(logText(), ul); });
        var btn = document.getElementById('recheck'), note = document.getElementById('recheck-note');
        notify.any = function () {
          Object.keys(UP).forEach(function (k) { var p = k.split('|'); if (p[0] === o.draftId && UP[k].state === 'done') replaced[p[1]] = true; });
          var busy = activeUploads(); btn.disabled = !!busy;
          note.textContent = busy ? 'Waiting for ' + busy + ' clip' + (busy === 1 ? '' : 's') + ' to finish uploading…' : 'Questions? Reply to the email about this order.';
        };
        btn.addEventListener('click', function () { act(o, 'recheck', null, btn).then(function () { renderOrder(o.orderId); }, function () {}); });
      };
    } else if (status === 'Checking Footage' || status === 'Check: possible spam') {
      h += '<p class="bbm-notice">We\'re checking your clips. This usually takes a few minutes. If anything needs fixing, you\'ll see it here and get an email.</p>';
    } else if (['Ready for Edit', 'In Edit', 'In Review', 'Revision Requested'].indexOf(status) >= 0) {
      h += '<p class="bbm-notice">' + (status === 'Revision Requested' ? 'Our editor is making the change you asked for. ' : 'Your clips passed the check and our editor is on it. ') + 'We\'ll email you when it\'s ready to post.</p>';
    } else if (status === 'Cancelled') {
      h += '<p class="bbm-notice bad">This order was cancelled. Questions? Reply to the email about this order.</p>';
    }
    if (['Delivered', 'Posted', 'Complete'].indexOf(status) >= 0) {
      if (o.videoUrl) h += '<div class="bbm-card" style="flex-direction:row;align-items:center;gap:16px"><a class="video-tile" href="' + esc(o.videoUrl) + '" target="_blank" rel="noopener" aria-label="Watch the video">' + ICON.play + '</a>'
        + '<div class="stack-8"><strong>Your finished video</strong><a class="bbm-btn bbm-btn-sm" href="' + esc(o.videoUrl) + '" target="_blank" rel="noopener">Watch & download</a></div></div>';
      var fu = o.followUp;
      if (status !== 'Delivered') h += '<p class="bbm-notice good">Posted' + (o.postedOn ? ' on ' + esc(o.postedOn) : '') + '. Thank you!'
        + (fu && !fu.ready ? ' Your follow-up post will be ready here ' + (fu.readyOn ? 'on ' + esc(fu.readyOn) : 'two days after posting') + '.' : '') + '</p>';
      if (fu && fu.ready) h += followUpHtml(fu);
      var k = o.kit;
      if (k) {
        var pollText = k.question + '\n' + k.options.map(function (x, i) { return (i + 1) + '. ' + x; }).join('\n');
        if (status === 'Delivered') h += '<div class="bbm-card sunken"><span class="eyebrow">Post it</span><p class="card-title">' + esc(k.when || ('Any ' + k.day)) + '</p><p class="meta">' + esc(k.setting || '') + '</p></div>';
        h += '<section class="group"><div class="plan-top"><h2>Caption</h2><button class="bbm-btn bbm-btn-sm" data-copy="cap">Copy</button></div><p class="copy-box">' + esc(k.caption) + '</p></section>';
        if (k.question) h += '<section class="group"><div class="plan-top"><h2>Poll</h2><button class="bbm-btn bbm-btn-sm" data-copy="poll">Copy</button></div><div class="copy-box"><strong>' + esc(k.question) + '</strong>'
          + k.options.map(function (x, i) { return '<br>' + (i + 1) + '. ' + esc(x); }).join('') + '</div></section>';
        if (status === 'Delivered') h += '<section class="group"><h2>How to post it on Band</h2><ol class="steps-list"><li>Save the video to your phone.</li><li>In Band, start a new post, attach the video and paste the caption.</li>'
          + (k.question ? '<li>Add a poll with the question and answers above.</li>' : '') + '<li>Pin the post, then tap <strong>I\'ve posted it</strong> below.</li></ol></section>';
      }
      if (o.canPost) h += '<div class="stack-8"><button class="bbm-btn bbm-btn-primary bbm-btn-block" id="posted">I\'ve posted it</button><p class="meta center">Two days later we\'ll give you a follow-up post that matches your poll result.</p></div>';
      if (o.canChange) h += '<details class="shotlist" id="changebox"><summary>Need a change?</summary><p class="meta" style="margin-top:8px">One round of changes is included. Ask before you post.</p>'
        + '<div class="bbm-field" style="margin-top:12px"><label for="chg">What should we change?</label><textarea id="chg" rows="4" placeholder="e.g. Fix the spelling of Mrs. Gable\'s name in the banner"></textarea></div>'
        + '<button class="bbm-btn bbm-btn-block" id="change" style="margin-top:12px">Request a change</button></details>';
      else if (status === 'Delivered' && o.changeUsed) h += '<p class="meta">Your round of changes for this video has been used.</p>';
      after = (function (prev) {
        return function () {
          if (prev) prev();
          app.querySelectorAll('[data-copy]').forEach(function (b) { b.addEventListener('click', function () { copyText(b.dataset.copy === 'cap' ? k.caption : pollText, b); }); });
          bindFollowUp(o);
          var p = document.getElementById('posted');
          if (p) p.addEventListener('click', function () { act(o, 'posted', null, p).then(function () { renderOrder(o.orderId); }, function () {}); });
          var c = document.getElementById('change');
          if (c) c.addEventListener('click', function () {
            var notes = document.getElementById('chg').value.trim();
            if (countWords(notes) < 3) { toast('Please describe the change in a few words'); document.getElementById('chg').focus(); return; }
            act(o, 'change', { notes: notes }, c).then(function () { renderOrder(o.orderId); }, function () {});
          });
        };
      })(after);
    }
    h += '<a class="bbm-btn bbm-btn-text" href="#home" style="align-self:center">Back to Home</a>';
    app.innerHTML = h;
    if (after) after();
  }
  function statsHtml(st) {
    st = st || {};
    var num = function (id, label, val) {
      return '<div class="bbm-field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="text" inputmode="numeric" autocomplete="off" value="' + esc(val == null ? '' : val) + '"></div>';
    };
    return '<div class="stack-8"><p class="eyebrow">For your monthly report (optional)</p>'
      + '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' + num('fu_votes', 'Poll votes', st.votes) + num('fu_comments', 'Comments', st.comments) + num('fu_views', 'Views', st.views) + '</div>'
      + '<div class="bbm-field"><label for="fu_best">Best comment</label><textarea id="fu_best" rows="3" maxlength="500">' + esc(st.bestComment || '') + '</textarea>'
      + '<div class="bbm-field-foot"><span>Type [Student] in place of any child\'s name, and leave out who wrote it.</span></div></div></div>';
  }
  function readStats() {
    var v = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; };
    return { votes: v('fu_votes'), comments: v('fu_comments'), views: v('fu_views'), bestComment: v('fu_best') };
  }
  function statsProblem(st) {
    var bad = ['votes', 'comments', 'views'].filter(function (k) { return st[k] && !/^\d[\d,]*$/.test(st[k]); });
    return bad.length ? 'Please use whole numbers for ' + bad.join(' and ') + ' (or leave them blank).' : '';
  }
  function followUpHtml(fu) {
    var h = '<section class="bbm-card" id="followup"><span class="eyebrow">Follow-up post</span>';
    var chosen = fu.chosen && fu.post;
    if (chosen) {
      h += '<p class="card-title">Most votes: ' + esc(fu.options[fu.chosen - 1]) + '</p>'
        + '<div class="plan-top"><p class="meta">Post this in your Band as a new post.</p><button class="bbm-btn bbm-btn-sm" id="fucopy">Copy</button></div>'
        + '<p class="copy-box" id="fupost">' + esc(fu.post) + '</p>'
        + '<button class="bbm-btn bbm-btn-text" id="fuchange" style="align-self:flex-start">Picked the wrong answer?</button>';
    }
    h += '<div class="stack-8" id="fuopts"' + (chosen ? ' hidden' : '') + '><p class="card-title">Which poll answer got the most votes?</p>'
      + '<fieldset class="bbm-options"><legend class="meta">' + esc(fu.question) + '</legend>'
      + fu.options.map(function (x, i) {
        return '<label class="bbm-option"><input type="radio" name="fuopt" value="' + (i + 1) + '"><span class="bbm-option-name">' + esc(x) + '</span></label>';
      }).join('') + '</fieldset>'
      + (chosen ? '' : statsHtml(fu.stats))
      + '<button class="bbm-btn bbm-btn-primary bbm-btn-block" id="fusend">Show my follow-up post</button></div>';
    if (chosen) h += '<div class="stack-8" id="fustats" style="margin-top:8px">' + statsHtml(fu.stats) + '<button class="bbm-btn bbm-btn-block" id="fusave">Save numbers</button>'
      + '<p class="meta">You can come back and update these as more families vote.</p></div>';
    return h + '</section>';
  }
  function bindFollowUp(o) {
    var c = document.getElementById('fucopy'); if (c) c.addEventListener('click', function () { copyText(o.followUp.post, c); });
    var ch = document.getElementById('fuchange'); if (ch) ch.addEventListener('click', function () { document.getElementById('fuopts').hidden = false; ch.hidden = true; });
    app.querySelectorAll('input[name=fuopt]').forEach(function (r) {
      r.addEventListener('change', function () { app.querySelectorAll('input[name=fuopt]').forEach(function (x) { x.closest('.bbm-option').classList.toggle('is-checked', x.checked); }); });
    });
    function flashBad(msg) { var f = document.getElementById('flash'); if (f) f.remove(); document.getElementById('followup').insertAdjacentHTML('afterbegin', '<p class="bbm-notice bad" id="flash" role="alert">' + esc(msg) + '</p>'); }
    var send = document.getElementById('fusend');
    if (send) send.addEventListener('click', function () {
      var pick = app.querySelector('input[name=fuopt]:checked');
      if (!pick) { flashBad('Please choose the answer that got the most votes.'); return; }
      var st = document.getElementById('fu_votes') && !document.getElementById('fustats') ? readStats() : {};
      var bad = statsProblem(st); if (bad) { flashBad(bad); return; }
      act(o, 'poll', Object.assign({ opt: pick.value }, st), send).then(function () {
        FLASH = null; renderOrder(o.orderId);
        setTimeout(function () { var f = document.getElementById('followup'); if (f) f.scrollIntoView({ block: 'start' }); }, 600);
      }, function () {});
    });
    var save = document.getElementById('fusave');
    if (save) save.addEventListener('click', function () {
      var st = readStats(), bad = statsProblem(st); if (bad) { flashBad(bad); return; }
      act(o, 'stats', st, save).then(function () { renderOrder(o.orderId); }, function () {});
    });
  }
  function humanize(text) {
    if (/^Missing: /.test(text)) return 'Missing. Please add this clip.';
    var t = String(text).replace(/^Too short: Obj-\S+ is /, 'Too short: ').replace(/^Looks (\w+): \S+\. /, 'Looks $1. ').replace(/Obj-\d+_(Shot_\d+|Extra_\d+|Voiceover)/g, 'this clip');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function findShot(formType, shot) {
    var V = VIDEOS[formType];
    if (V) {
      var vals = {}, sets = [{}, { spotlightType: 'Staff Spotlight (90s Sitcom Intro)' }, { presentationFormat: 'Voiceover + Visual Demonstrations' }, { voOption: 'Uploading Own Audio File' }];
      for (var i = 0; i < sets.length; i++) {
        vals = sets[i];
        var all = V.shots(vals).concat(V.optional ? V.optional(vals) : []);
        var hit = all.filter(function (x) { return x.shot === shot; })[0];
        if (hit) return { shot: hit.shot, n: hit.n, what: i === 1 || /^Moment|^Category|^Area|^Students: Benefit/.test(hit.what) ? '' : hit.what, min: hit.min, accept: hit.accept };
      }
    }
    var m = shot.match(/_(Shot|Extra)_(\d+)$/);
    return { shot: shot, n: m ? (m[1] === 'Extra' ? 'Extra ' + m[2] : Number(m[2])) : shot.replace(/^Obj-\d+_/, ''), what: '', min: 0 };
  }

  route();
})();
</script>
