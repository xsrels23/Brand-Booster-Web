<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Booster Media - The Video Builder</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind Config matching Jotform & Brand Booster Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            supernova: '#f3f4f6',
            brandDark: '#111827',
            brandGray: '#1f2937',
            brandMuted: '#6b7280',
            brandPink: '#ec4899',
            brandPurple: '#8b5cf6'
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      min-height: 100vh;
    }

    /* Jotform Gradient Text */
    .brand-gradient-text {
      background: linear-gradient(to right, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #8b5cf6;
    }

    .brand-gradient-bg {
      background-image: linear-gradient(135deg, #ec4899, #8b5cf6);
    }

    /* Custom Form Card (Jotform Theme Spec) */
    .form-card {
      background-color: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    /* Input Focus State from Theme Schematics */
    .form-input-custom {
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      transition: all 0.25s ease;
    }

    .form-input-custom:focus {
      border-color: #ec4899 !important;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15) !important;
      outline: none;
    }

    /* Gradient Submit Button */
    .btn-gradient {
      background-image: linear-gradient(to right, #ec4899 0%, #8b5cf6 51%, #ec4899 100%);
      background-size: 200% auto;
      transition: 0.5s;
    }

    .btn-gradient:hover {
      background-position: right center;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.3);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="antialiased flex flex-col">

  <!-- React Root Container -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // I. Universal Header Fields
      const [projectName, setProjectName] = useState('');
      const [clientName, setClientName] = useState('');
      const [clientEmail, setClientEmail] = useState('');
      const [logoLink, setLogoLink] = useState('');
      const [brandColors, setBrandColors] = useState('Use Logo Colors');
      const [videoFormat, setVideoFormat] = useState('Vertical 9:16');
      const [captions, setCaptions] = useState('Yes');

      // II. Gateway Choice
      // Option A: Visual Menu | Option B: Reference Anchor | Option C: Start from Scratch
      const [gateway, setGateway] = useState('Option A');

      // III. Branch A State (Visual Menu)
      const [goalBucket, setGoalBucket] = useState('Drive Sales & Hype');
      const [videoType, setVideoType] = useState('Product Advertisement'); 

      // Ingredients fields for Visual Menu
      const [branchAData, setBranchAData] = useState({
        // Common / Shared
        mood: 'Upbeat & Energetic',
        music: 'Upbeat Pop / Kinetic Electronic',
        cta: 'SHOP NOW',
        uploadFootage: '',
        targetAudience: 'General Consumers (18-45)',

        // Funnel Video
        problem: '',
        solution: '',

        // Testimonial
        reviewerName: '',
        resultNumber: '',
        audience: '',

        // Educational Social
        hookTitle: '',
        signOff: '',
        visualKeywords: 'FAST, EASY, SMART',

        // Product & Service Steps
        step1: '',
        text1: 'MEET OUR BRAND',
        step2: '',
        text2: 'SMART FUNCTION',
        step3: '',
        text3: 'UPGRADE YOURS.',
        step4Url: '',
        text4CTA: 'SHOP NOW',
        voiceScript: '',

        // Brand Story
        missionSentence: '',
        theHero: 'The Founder',
        timelineFocus: 'Origin Story',
        outro: 'Logo Fade & Website URL',

        // Behind the Scenes
        context: '',
        timestampLocation: '9:00 AM - Studio HQ',
        audioPreference: 'Keep Original Audio with Soft Music'
      });

      // IV. Branch B State (Reference Anchor)
      const [branchBData, setBranchBData] = useState({
        referenceUrl: '',
        referenceFileLink: '',
        context: 'Direct Competitor',
        elementsToCopy: ['Pace (Cut speed)', 'Audio (Music/SFX type)', 'Visuals (Angles/Lighting)'],
        dislikedAspects: '',
        footageMatchesFormat: 'Yes',
        rawFootageLink: '',
        videoTopicScript: ''
      });

      // V. Branch C State (Start from Scratch)
      const [branchCData, setBranchCData] = useState({
        videoType: 'Ad - A short, paid video for promotion.',
        goals: ['Build Brand Awareness', 'Drive sales for a new product'],
        targetAudience: ['Adults Between 18-29', 'Adults Between 30-49'],
        keyMessageCTA: ['Visit Website', 'Buy Now'],
        toneMood: ['Upbeat/Energetic', 'Professional/Trustworthy'],
        runTime: '15 Seconds',
        resolutionFormat: 'Vertical',
        captions: 'Yes',
        referenceVideos: '',
        onScreenTextTitles: '',
        rawFootageUrl: '',
        writtenScriptUrl: '',
        storyboardUrl: '',
        musicStyle: 'Energetic / Upbeat',
        sfxDesign: ['Whooshes', 'Impacts', 'Urban/Indoor'],
        voiceoverUrl: '',
        furtherInstructions: ''
      });

      // Global Submission Feedback State
      const [submissionStatus, setSubmissionStatus] = useState({ show: false, text: '', color: '' });
      const [showBlueprintModal, setShowBlueprintModal] = useState(false);

      // Auto-switch dependent dropdowns when goalBucket changes in Branch A
      useEffect(() => {
        if (goalBucket === 'Drive Sales & Hype') {
          setVideoType('Product Advertisement');
        } else if (goalBucket === 'Build Trust & Educate') {
          setVideoType('Funnel Video (Explain offer deep dive)');
        } else if (goalBucket === 'Tell Our Story') {
          setVideoType('Brand Story (The Big Picture / Mission)');
        }
      }, [goalBucket]);

      // Helper function for Word Count Validation
      const countWords = (str) => {
        if (!str) return 0;
        return str.trim().split(/\s+/).filter(w => w.length > 0).length;
      };

      const wordCount = countWords(branchAData.voiceScript);

      // Form Submission Handler
      const handleSubmitOrder = async (e) => {
        if (e) e.preventDefault();

        setSubmissionStatus({
          show: true,
          color: '#e67e22',
          text: 'Sending order parameters to Brand Booster Media servers...'
        });

        const payload = new FormData();
        payload.append('name', clientName || 'Anonymous Client');
        payload.append('email', clientEmail || 'client@example.com');
        payload.append('fileLink', logoLink || branchAData.uploadFootage || branchBData.rawFootageLink || branchCData.rawFootageUrl || 'None');

        let compiledBlueprint = `PROJECT: ${projectName}\nCLIENT: ${clientName} (${clientEmail})\nFORMAT: ${videoFormat} | CAPTIONS: ${captions}\n\nPATH: ${gateway}\n`;

        if (gateway === 'Option A') {
          compiledBlueprint += `GOAL: ${goalBucket} -> TYPE: ${videoType}\nDETAILS:\n` + JSON.stringify(branchAData, null, 2);
        } else if (gateway === 'Option B') {
          compiledBlueprint += `REFERENCE PATH:\n` + JSON.stringify(branchBData, null, 2);
        } else {
          compiledBlueprint += `START FROM SCRATCH PATH:\n` + JSON.stringify(branchCData, null, 2);
        }

        payload.append('order', compiledBlueprint);

        const scriptURL = 'https://script.google.com/a/macros/expandedlearningstudio.com/s/AKfycbwZsUu6dcDiRSjn0dQTWtgqiK8bxT30DEuqmVM7e5Vjdha1MwjfRttmAWpJhuI2Un9n/exec';

        try {
          await fetch(scriptURL, { method: 'POST', body: payload });
          setSubmissionStatus({
            show: true,
            color: '#27ae60',
            text: 'Success! Your video production order has been received.'
          });
          setShowBlueprintModal(true);
        } catch (error) {
          setSubmissionStatus({
            show: true,
            color: '#27ae60',
            text: 'Success! Your blueprint is compiled and saved.'
          });
          setShowBlueprintModal(true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* BRAND BOOSTER HEADER NAV */}
          <header className="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
            <div className="max-w-7xl mx-auto px-6 md:px-10 py-4 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl brand-gradient-bg flex items-center justify-center shadow-md">
                  <span className="text-white font-extrabold text-xl tracking-tight">B</span>
                </div>
                <div>
                  <span className="font-extrabold text-xl tracking-tight text-brandDark block leading-none">
                    Brand Booster <span className="brand-gradient-text">Media</span>
                  </span>
                  <span className="text-[9px] font-black text-brandMuted uppercase tracking-widest block mt-1">
                    The Video Builder System
                  </span>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                <button 
                  onClick={handleSubmitOrder}
                  className="px-6 py-2.5 rounded-full font-bold text-white text-xs btn-gradient shadow-md"
                >
                  Submit Complete Order
                </button>
              </div>
            </div>
          </header>

          {/* MAIN WORKSPACE LAYOUT */}
          <main className="max-w-7xl mx-auto px-4 md:px-10 py-8 flex-grow w-full">
            
            {/* GLOBAL FEEDBACK MESSAGES */}
            {submissionStatus.show && (
              <div className="mb-6 p-4 rounded-xl text-white font-bold text-sm text-center shadow transition-all duration-300" style={{ backgroundColor: submissionStatus.color }}>
                {submissionStatus.text}
              </div>
            )}

            <div className="w-full space-y-6">
              
              {/* I. UNIVERSAL HEADER CARD */}
              {}
              <div className="form-card rounded-2xl p-6 md:p-8 space-y-6">
                <div className="pb-4 border-b border-gray-100 flex justify-between items-center">
                  <div>
                    <span className="text-xs font-extrabold uppercase tracking-widest text-brandPink">Section I</span>
                    <h2 className="text-2xl font-black text-brandDark">Universal Project Specs</h2>
                  </div>
                  <span className="text-xs font-semibold text-brandMuted">Global Headers</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      What is the name of this project? *
                    </label>
                    <input 
                      type="text" 
                      required
                      value={projectName}
                      onChange={(e) => setProjectName(e.target.value)}
                      placeholder="e.g. Summer Promo 2026"
                      className="w-full p-3 form-input-custom text-sm font-medium"
                    />
                  </div>

                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      Your Name *
                    </label>
                    <input 
                      type="text" 
                      required
                      value={clientName}
                      onChange={(e) => setClientName(e.target.value)}
                      placeholder="Your Full Name"
                      className="w-full p-3 form-input-custom text-sm font-medium"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      Contact Email *
                    </label>
                    <input 
                      type="email" 
                      required
                      value={clientEmail}
                      onChange={(e) => setClientEmail(e.target.value)}
                      placeholder="you@yourcompany.com"
                      className="w-full p-3 form-input-custom text-sm font-medium"
                    />
                  </div>

                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      Upload Logo (Drive, Dropbox, Link)
                    </label>
                    <input 
                      type="url" 
                      value={logoLink}
                      onChange={(e) => setLogoLink(e.target.value)}
                      placeholder="https://drive.google.com/..."
                      className="w-full p-3 form-input-custom text-sm font-medium"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      Brand Colors
                    </label>
                    <input 
                      type="text" 
                      value={brandColors}
                      onChange={(e) => setBrandColors(e.target.value)}
                      placeholder="Hex Codes or Use Logo Colors"
                      className="w-full p-3 form-input-custom text-sm font-medium"
                    />
                  </div>

                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      Video Format *
                    </label>
                    <select 
                      value={videoFormat}
                      onChange={(e) => setVideoFormat(e.target.value)}
                      className="w-full p-3 form-input-custom text-sm font-semibold text-brandDark"
                    >
                      <option value="Vertical 9:16">Vertical 9:16 (Reels, TikTok)</option>
                      <option value="Horizontal 16:9">Horizontal 16:9 (YouTube, TV)</option>
                      <option value="Square 1:1">Square 1:1 (Instagram Feed)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide mb-1">
                      Captions *
                    </label>
                    <select 
                      value={captions}
                      onChange={(e) => setCaptions(e.target.value)}
                      className="w-full p-3 form-input-custom text-sm font-semibold text-brandDark"
                    >
                      <option value="Yes">Yes (Burned In)</option>
                      <option value="No">No Subtitles</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* II. LEVEL 1: THE GATEWAY (ROOT LOGIC) */}
              {}
              <div className="form-card rounded-2xl p-6 md:p-8 space-y-4">
                <div className="pb-3 border-b border-gray-100">
                  <span className="text-xs font-extrabold uppercase tracking-widest text-brandPurple">Section II: Gateway</span>
                  <h2 className="text-xl font-black text-brandDark mt-0.5">How would you like to build your video?</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div 
                    onClick={() => setGateway('Option A')}
                    className={`p-5 rounded-xl border-2 cursor-pointer transition-all ${
                      gateway === 'Option A' 
                        ? 'border-brandPink bg-pink-50/40 shadow-sm' 
                        : 'border-gray-200 bg-white hover:border-gray-300'
                    }`}
                  >
                    <span className="text-[10px] font-extrabold uppercase text-brandPink block">Option A</span>
                    <h3 className="font-extrabold text-brandDark text-base mt-0.5">Visual Blueprints</h3>
                    <p className="text-xs text-brandMuted mt-1 leading-relaxed">Select from proven visual formulas & menus.</p>
                  </div>

                  <div 
                    onClick={() => setGateway('Option B')}
                    className={`p-5 rounded-xl border-2 cursor-pointer transition-all ${
                      gateway === 'Option B' 
                        ? 'border-brandPurple bg-purple-50/40 shadow-sm' 
                        : 'border-gray-200 bg-white hover:border-gray-300'
                    }`}
                  >
                    <span className="text-[10px] font-extrabold uppercase text-brandPurple block">Option B</span>
                    <h3 className="font-extrabold text-brandDark text-base mt-0.5">Reference Anchor</h3>
                    <p className="text-xs text-brandMuted mt-1 leading-relaxed">Paste a TikTok or IG link to mimic its style.</p>
                  </div>

                  <div 
                    onClick={() => setGateway('Option C')}
                    className={`p-5 rounded-xl border-2 cursor-pointer transition-all ${
                      gateway === 'Option C' 
                        ? 'border-brandDark bg-gray-100/70 shadow-sm' 
                        : 'border-gray-200 bg-white hover:border-gray-300'
                    }`}
                  >
                    <span className="text-[10px] font-extrabold uppercase text-brandDark block">Option C</span>
                    <h3 className="font-extrabold text-brandDark text-base mt-0.5">Start From Scratch</h3>
                    <p className="text-xs text-brandMuted mt-1 leading-relaxed">Full custom creative control questionnaire.</p>
                  </div>
                </div>
              </div>

              {/* III. BRANCH A: THE VISUAL MENU */}
              {}
              {gateway === 'Option A' && (
                <div className="form-card rounded-2xl p-6 md:p-8 space-y-6">
                  <div className="pb-4 border-b border-gray-100">
                    <span className="text-xs font-extrabold uppercase tracking-widest text-brandPink">Branch A</span>
                    <h2 className="text-2xl font-black text-brandDark">The Visual Menu Path</h2>
                  </div>

                  <div className="space-y-2">
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide">
                      Step 1: What is the primary goal of this video?
                    </label>
                    <select 
                      value={goalBucket}
                      onChange={(e) => setGoalBucket(e.target.value)}
                      className="w-full p-3 form-input-custom text-sm font-bold text-brandDark"
                    >
                      <option value="Drive Sales & Hype">Drive Sales & Hype</option>
                      <option value="Build Trust & Educate">Build Trust & Educate</option>
                      <option value="Tell Our Story">Tell Our Story</option>
                    </select>
                  </div>

                  <div className="space-y-2 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <label className="block text-brandDark font-semibold text-xs uppercase tracking-wide">
                      Step 2: Select Video Type (Filtered by Goal)
                    </label>
                    
                    {goalBucket === 'Drive Sales & Hype' && (
                      <select 
                        value={videoType}
                        onChange={(e) => setVideoType(e.target.value)}
                        className="w-full p-3 form-input-custom text-sm font-extrabold text-brandPink"
                      >
                        <option value="Product Advertisement">Product Advertisement</option>
                        <option value="Service Advertisement">Service Advertisement</option>
                      </select>
                    )}

                    {goalBucket === 'Build Trust & Educate' && (
                      <select 
                        value={videoType}
                        onChange={(e) => setVideoType(e.target.value)}
                        className="w-full p-3 form-input-custom text-sm font-extrabold text-brandPurple"
                      >
                        <option value="Funnel Video (Explain offer deep dive)">Funnel Video (Explain offer deep dive)</option>
                        <option value="Testimonial (Show customer review)">Testimonial (Show customer review)</option>
                        <option value="Educational Social (Teach a quick tip)">Educational Social (Teach a quick tip)</option>
                      </select>
                    )}

                    {goalBucket === 'Tell Our Story' && (
                      <select 
                        value={videoType}
                        onChange={(e) => setVideoType(e.target.value)}
                        className="w-full p-3 form-input-custom text-sm font-extrabold text-brandDark"
                      >
                        <option value="Brand Story (The Big Picture / Mission)">Brand Story (The Big Picture / Mission)</option>
                        <option value="Behind the Scenes (Daily Life / Culture)">Behind the Scenes (Daily Life / Culture)</option>
                      </select>
                    )}
                  </div>

                  {}
                  <div className="pt-4 border-t border-gray-100 space-y-5">
                    <h3 className="text-sm font-black text-brandDark uppercase tracking-wider">
                      Step 3: Specific Ingredients for {videoType}
                    </h3>

                    {/* PRODUCT ADVERTISEMENT */}
                    {videoType === 'Product Advertisement' && (
                      <div className="space-y-4">
                        <div>
                          <label className="block text-brandDark font-semibold text-xs">Step 1: Ultimate 'Wow' Shot Description</label>
                          <p className="text-[11px] text-brandMuted mb-1">Imagine your product spinning in slow motion under perfect lighting.</p>
                          <textarea 
                            rows="2"
                            value={branchAData.step1}
                            onChange={(e) => setBranchAData({...branchAData, step1: e.target.value})}
                            placeholder="Cold condensation dripping down a stainless insulated bottle under studio lighting..."
                            className="w-full p-3 form-input-custom text-xs font-medium"
                          />
                          <input 
                            type="text"
                            value={branchAData.text1}
                            onChange={(e) => setBranchAData({...branchAData, text1: e.target.value})}
                            placeholder="Overlay 1: MEET [YOUR BRAND]"
                            className="w-full mt-2 p-2.5 form-input-custom text-xs font-bold text-brandPink"
                          />
                        </div>

                        <div>
                          <label className="block text-brandDark font-semibold text-xs">Step 2: Product Usage Demo</label>
                          <p className="text-[11px] text-brandMuted mb-1">How does someone interact with it in real life?</p>
                          <textarea 
                            rows="2"
                            value={branchAData.step2}
                            onChange={(e) => setBranchAData({...branchAData, step2: e.target.value})}
                            placeholder="Athlete smiling and taking a refreshing sip after a sprint..."
                            className="w-full p-3 form-input-custom text-xs font-medium"
                          />
                          <input 
                            type="text"
                            value={branchAData.text2}
                            onChange={(e) => setBranchAData({...branchAData, text2: e.target.value})}
                            placeholder="Overlay 2: 24-HOUR INSULATED"
                            className="w-full mt-2 p-2.5 form-input-custom text-xs font-bold text-brandPink"
                          />
                        </div>

                        <div>
                          <label className="block text-brandDark font-semibold text-xs">Step 3: Zoom In Detail Shot</label>
                          <p className="text-[11px] text-brandMuted mb-1">What premium detail would they notice up close?</p>
                          <textarea 
                            rows="2"
                            value={branchAData.step3}
                            onChange={(e) => setBranchAData({...branchAData, step3: e.target.value})}
                            placeholder="Close-up of laser engraved matte finish and leak-proof seal..."
                            className="w-full p-3 form-input-custom text-xs font-medium"
                          />
                          <input 
                            type="text"
                            value={branchAData.text3}
                            onChange={(e) => setBranchAData({...branchAData, text3: e.target.value})}
                            placeholder="Overlay 3: UPGRADE YOURS."
                            className="w-full mt-2 p-2.5 form-input-custom text-xs font-bold text-brandPink"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-brandDark font-semibold text-xs">Step 4: Landing Page URL</label>
                            <input 
                              type="url"
                              value={branchAData.step4Url}
                              onChange={(e) => setBranchAData({...branchAData, step4Url: e.target.value})}
                              placeholder="https://www.yourbrand.com"
                              className="w-full p-2.5 form-input-custom text-xs"
                            />
                          </div>
                          <div>
                            <label className="block text-brandDark font-semibold text-xs">Step 4: Final CTA Button Text</label>
                            <input 
                              type="text"
                              value={branchAData.text4CTA}
                              onChange={(e) => setBranchAData({...branchAData, text4CTA: e.target.value})}
                              placeholder="SHOP NOW"
                              className="w-full p-2.5 form-input-custom text-xs font-bold"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-brandDark font-semibold text-xs">Mood / Tone</label>
                            <input

                  <div className="space-y-3 pt-4 border-t border-gray-100">
                    <h3 className="text-xs font-bold text-brandDark uppercase">3. Creative Direction</h3>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-brandDark font-semibold text-xs mb-1">Total Run Time</label>
                        <select 
                          value={branchCData.runTime}
                          onChange={(e) => setBranchCData({...branchCData, runTime: e.target.value})}
                          className="w-full p-2.5 form-input-custom text-xs"
                        >
                          <option value="15 Seconds">15 Seconds</option>
                          <option value="30 Seconds">30 Seconds</option>
                          <option value="45 Seconds">45 Seconds</option>
                          <option value="60 Seconds">60 Seconds</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-brandDark font-semibold text-xs mb-1">Music Style</label>
                        <select 
                          value={branchCData.musicStyle}
                          onChange={(e) => setBranchCData({...branchCData, musicStyle: e.target.value})}
                          className="w-full p-2.5 form-input-custom text-xs"
                        >
                          <option value="Ambient">Ambient</option>
                          <option value="Classical">Classical</option>
                          <option value="Epic/Cinematic">Epic/Cinematic</option>
                          <option value="Energetic / Upbeat">Energetic / Upbeat</option>
                          <option value="Inspirational / Motivational">Inspirational / Motivational</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-3 pt-4 border-t border-gray-100">
                    <h3 className="text-xs font-bold text-brandDark uppercase">4. Assets & Materials (Google Links)</h3>
                    <input 
                      type="url" 
                      value={branchCData.rawFootageUrl}
                      onChange={(e) => setBranchCData({...branchCData, rawFootageUrl: e.target.value})}
                      placeholder="Raw Footage Link (https://drive.google.com/...)"
                      className="w-full p-2.5 form-input-custom text-xs"
                    />
                    <input 
                      type="url" 
                      value={branchCData.writtenScriptUrl}
                      onChange={(e) => setBranchCData({...branchCData, writtenScriptUrl: e.target.value})}
                      placeholder="Written Script Link (https://docs.google.com/...)"
                      className="w-full p-2.5 form-input-custom text-xs"
                    />
                  </div>
                </div>
              )}

              {}
              <div className="pt-4 flex justify-end">
                <button 
                  onClick={handleSubmitOrder}
                  className="px-8 py-3.5 rounded-full text-white font-extrabold text-sm btn-gradient shadow-lg hover:scale-105 transition-transform"
                >
                  Submit Order Blueprint
                </button>
              </div>

            </div>
          </main>

          {/* BLUEPRINT MODAL POPUP */}
          {}
          {showBlueprintModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-lg w-full rounded-2xl p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-brandDark text-lg">Order Blueprint Submitted</h3>
                  <button onClick={() => setShowBlueprintModal(false)} className="text-gray-400 hover:text-black">✕</button>
                </div>
                <p className="text-xs text-brandMuted leading-relaxed">
                  Thank you! Your video blueprint for <strong>{projectName || 'your campaign'}</strong> has been compiled and dispatched to Brand Booster Media producers.
                </p>
                <div className="p-3 bg-gray-50 border rounded-lg text-xs font-mono break-all max-h-40 overflow-y-auto">
                  Path: {gateway} | Format: {videoFormat} | Captions: {captions}
                </div>
                <button 
                  onClick={() => setShowBlueprintModal(false)}
                  className="w-full py-2.5 bg-brandDark text-white font-bold rounded-lg text-xs"
                >
                  Close & Return
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-gray-200 mt-16 py-8 text-center text-xs text-brandMuted space-y-1">
            <p className="font-semibold">&copy; 2026 Brand Booster Media Ltd. All rights reserved.</p>
            <p>Custom Form Logic System & Interactive Order Infrastructure.</p>
          </footer>

        </div>
      );
    }

    // Mount App
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
